# 全栈开发规则第 2/6 节要求"沿用项目的语言规范、格式化、静态检查和类型检查"，
# 并把能自动验证的条件固化到 CI。仓库此前只有 pytest，没有可复现的静态检查门禁；
# 这里补最小配置，CI 见 .github/workflows/ci.yml。

[tool.ruff]
target-version = "py314"  # ruff 0.14.4 尚无 py315 目标；升到支持 py315 的 ruff 后再改
line-length = 100
extend-exclude = [
    ".venv",
    "artifacts",
    "snapshots",
    "data",
    "firmware",
    "android",
    "evals",
    "node_modules",
]

[tool.ruff.lint]
# 只启用在当前代码库上"零债务"的规则集：未使用的导入/变量、语法与明显错误。
# 更严格的规则集（B/UP/SIM 等）会带出大量历史债务，需按文件分批清理后再扩展。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Django settings 的"先改环境变量、再 import settings"是刻意写法（E402 必然触发）。
"knowledgebase/test_settings.py" = ["E402"]
"knowledgebase/worker_test_settings.py" = ["E402"]
"knowledgebase/loadtest_settings.py" = ["E402"]
# 中段导入用于装饰器注册，且避开与 apps.voice 的循环导入（模块底部导入是刻意安排）。
"apps/planner/services.py" = ["E402"]
# 测试夹具常以"创建对象但其副作用才是目的"的写法赋值（如先建一个库供后续断言），
# 以及单行分号写法用于紧凑构造；这些不影响产品代码质量，按文件豁免。
"tests/*" = ["F841", "E702"]
# conftest 必须先把 pytest_addoption 等模块级设置写好，再导入依赖 Django 的模块（E402 刻意）。
"tests/conftest.py" = ["E402", "F841", "E702"]
# 运维/一次性脚本普遍先插入 sys.path 再导入（E402 是刻意写法），且不属于运行时。
"scripts/*" = ["E402", "E701", "E702", "F841"]

[tool.ruff.format]
quote-style = "double"