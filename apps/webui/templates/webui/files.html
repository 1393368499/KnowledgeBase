{% extends "webui/base.html" %}
{% load static %}
{% block title %}文件管理 · 智库{% endblock %}

{% block main %}
<div class="content files-page">
  <header class="page-header">
    <div><h1>文件管理</h1><p>上传、整理与解析资料。原件可预览，处理状态可追踪。</p></div>
    <div class="page-header-actions">
      <input type="file" id="files-input" multiple hidden>
      <input type="file" id="files-folder" webkitdirectory directory multiple hidden>
      <button class="btn" id="files-folder-button" type="button">扫描目录</button>
      <button class="btn primary" id="files-upload" type="button">上传资料</button>
    </div>
  </header>

  <div class="grid-3">
    <div class="stat-card"><div class="stat-value" id="stat-total">—</div><div class="stat-label">全部资料</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-done">—</div><div class="stat-label">已完成</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-processing">—</div><div class="stat-label">处理中</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-pending">—</div><div class="stat-label">待处理</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-failed">—</div><div class="stat-label">失败</div></div>
  </div>

  <div class="card" style="padding:0;margin-top:14px">
    <div class="files-controls row">
      <input class="input" id="files-kw" type="search" placeholder="按文件名搜索" aria-label="按文件名搜索">
      <select class="input" id="files-lib" aria-label="信息库">
        <option value="all">全部信息库</option>
      </select>
      <select class="input" id="files-type" aria-label="文件类型">
        <option value="all">文件类型</option>
      </select>
      <select class="input" id="files-nature" aria-label="资料性质" title="按自动识别或人工指定的资料性质筛选">
        <option value="all">资料性质</option>
        <option value="__unidentified__">待识别</option>
      </select>
      <select class="input" id="files-status" aria-label="处理状态">
        <option value="all">处理状态</option>
        <option value="pending">待处理</option>
        <option value="running">处理中</option>
        <option value="done">已完成</option>
        <option value="failed">失败</option>
      </select>
      <button class="btn sm" id="files-session">来自 AI 会话</button>
      <span class="grow"></span>
      <button class="btn sm" id="files-parse-all" type="button">全部解析</button>
    </div>

    <div id="files-upload-note"></div>
    <div id="files-nature-note"></div>
    <div id="files-perm-note"></div>

    <p class="table-scroll-hint" aria-hidden="true">可横向滚动查看全部列</p>
    <div class="table-region" tabindex="0" role="region" aria-label="资料列表，可横向滚动">
      <table class="table files-table">
        <thead><tr>
          <th><input type="checkbox" id="check-all" aria-label="选择本页所有资料"></th>
          <th>文件名</th><th>信息库</th><th>类型</th><th>性质</th><th>大小</th>
          <th>状态</th><th>段落</th><th>更新时间</th><th>操作</th>
        </tr></thead>
        <tbody id="files-body">
          <tr><td colspan="10"><p class="empty-state">加载中…</p></td></tr>
        </tbody>
      </table>
    </div>

    <div class="page-controls row">
      <span class="hint" id="files-page-info">—</span>
      <span class="hint" id="files-select-note" data-count="0"></span>
      <span class="grow"></span>
      <button class="btn sm" id="files-prev" disabled>上一页</button>
      <button class="btn sm" id="files-next" disabled>下一页</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'webui/kb-files.js' %}?v={{ KB_ASSET_VERSION }}"></script>
{% endblock %}
