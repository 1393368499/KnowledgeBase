<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库 AI 会话原型 · 单文件版</title>
<style>
/* ===== 与 React 版 src/styles/globals.css 同一套设计变量与骨架 ===== */
:root{
  --navbar-height:52px; --sidebar-width:220px;
  --color-bg:#fafafa; --color-surface:#fff;
  --color-dark:#171717; --color-text:#171717; --color-text-secondary:#737373;
  --color-border:#e5e5e5; --color-divider:#f0f0f0;
  --color-success:#2e7d32; --color-warning:#c4943a; --color-error:#c62828;
  --font-mono:"SFMono-Regular","JetBrains Mono",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--color-bg); color:var(--color-text);
  font-family:Inter,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
/* ===== 顶部导航栏（同 .app-navbar）===== */
.navbar{
  position:fixed; inset:0 0 auto 0; height:var(--navbar-height); z-index:1000;
  background:var(--color-surface); border-bottom:1px solid var(--color-border);
  display:flex; align-items:center; gap:12px; padding:0 20px;
}
.brand{display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer; white-space:nowrap}
.brand b{font-weight:700}
.navbar .badge{
  font-size:9px; line-height:1; letter-spacing:.04em; color:var(--color-text-secondary);
  border:1px solid var(--color-border); padding:4px 7px; border-radius:2px; background:#fcfcfc;
}
.grow{flex:1}
/* ===== 左侧导航（同 .app-sidebar + .sidebar-menu）===== */
.sidebar{
  position:fixed; top:var(--navbar-height); bottom:0; left:0; width:var(--sidebar-width); z-index:900;
  background:var(--color-surface); border-right:1px solid var(--color-border);
  display:flex; flex-direction:column; overflow:hidden;
}
.sidebar-menu{list-style:none; margin:0; padding:0}
.nav-item{
  height:44px; display:flex; align-items:center; gap:10px; padding:0 16px;
  font-size:13px; color:var(--color-text-secondary); cursor:pointer;
  border-left:3px solid transparent; transition:background .12s,color .12s,border-color .12s;
}
.nav-item:hover{background:#f7f7f7; color:var(--color-text)}
.nav-item.on{background:#f5f5f5; color:var(--color-dark); font-weight:600; border-left-color:var(--color-dark)}
.nav-icon{width:18px; text-align:center; font-size:13px; opacity:.9}
.session-block{
  flex:1; min-height:0; display:flex; flex-direction:column;
  border-top:1px solid var(--color-divider); margin-top:8px; padding-top:8px;
}
.session-block-head{display:flex; align-items:center; gap:6px; padding:2px 16px 6px}
.session-block-title{font-size:11px; letter-spacing:.06em; color:var(--color-text-secondary)}
.session-list{flex:1; overflow:auto; padding:0 8px 8px}
.session-item{padding:8px 10px; border-radius:2px; cursor:pointer; margin-bottom:2px}
.session-item:hover{background:#f7f7f7}
.session-item.active{background:#f0f0f0}
.session-item-title{font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.session-item-meta{font-size:10.5px; color:var(--color-text-secondary)}
.sidebar-foot{
  border-top:1px solid var(--color-divider); padding:10px 16px; font-size:11px;
  color:var(--color-text-secondary); display:flex; align-items:center; gap:8px;
}
/* ===== 主内容区（同 .app-content）===== */
.main{position:fixed; top:var(--navbar-height); left:var(--sidebar-width); right:0; bottom:0; overflow:auto; background:var(--color-bg)}
.content{max-width:1440px; padding:24px 32px 40px}
.page-header{margin:0 0 14px}
.page-header h2{margin:0; font-size:20px; font-weight:700; letter-spacing:-.01em}
.page-header p{margin:2px 0 0; font-size:12px; color:var(--color-text-secondary)}
/* ===== 通用组件 ===== */
.btn{
  appearance:none; border:1px solid var(--color-border); background:var(--color-surface); color:var(--color-text);
  padding:6px 12px; border-radius:2px; font-size:12.5px; cursor:pointer; transition:border-color .12s,background .12s,color .12s;
}
.btn:hover{border-color:var(--color-dark)}
.btn.sm{padding:4px 10px; font-size:12px}
.btn.primary{background:var(--color-dark); border-color:var(--color-dark); color:#fff}
.btn.primary:hover{background:#000}
.btn.ghost{border-color:transparent; background:transparent; padding:2px 8px}
.btn.ghost:hover{border-color:var(--color-border)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.danger,.table-actions .danger{color:var(--color-error)}
.card{background:var(--color-surface); border:1px solid var(--color-border); border-radius:2px; padding:16px; margin-bottom:14px}
.card-title{font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:8px}
.stat-card{
  background:var(--color-surface); border:1px solid var(--color-border); border-radius:2px; padding:14px 16px;
  transition:border-color .15s;
}
.stat-card:hover{border-color:var(--color-dark)}
.stat-value{font-family:var(--font-mono); font-size:26px; font-weight:700; line-height:1.25}
.stat-label{font-size:12px; color:var(--color-text-secondary); margin-top:2px}
.grid-2{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px}
.grid-3{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px}
.row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.field{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--color-text-secondary)}
.field input,.field select,.search-box input{
  border:1px solid var(--color-border); background:#fff; border-radius:2px; padding:6px 8px;
  font-size:13px; font-family:inherit; color:var(--color-text); min-width:150px;
}
.field input:focus,.field select:focus,.search-box input:focus,.composer-input:focus{outline:none; border-color:var(--color-dark)}
.tag{
  display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:2px; font-size:11px;
  border:1px solid var(--color-border); color:var(--color-text-secondary); background:#fcfcfc; white-space:nowrap;
}
.tag.ok{color:var(--color-success); border-color:#cfe3d0; background:#f4faf4}
.tag.warn{color:var(--color-warning); border-color:#ece0c6; background:#fdfaf2}
.tag.info{color:var(--color-dark); border-color:#dcdcdc; background:#f7f7f7}
.tag.bad{color:var(--color-error); border-color:#eed3d3; background:#fdf5f5}
.muted{color:var(--color-text-secondary)}
.tiny{font-size:11.5px}
.mono{font-family:var(--font-mono)}
.hint{font-size:11.5px; color:var(--color-text-secondary)}
.status-dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; vertical-align:middle; background:#a3a3a3}
.status-dot.completed{background:var(--color-success)}
.status-dot.processing{background:var(--color-warning)}
.status-dot.pending{background:#8a8a8a}
.status-dot.failed{background:var(--color-error)}
.status-dot.archived{background:#c4c4c4}
.progress{height:3px; background:var(--color-divider); margin-top:5px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--color-dark)}
.empty-state{padding:8px 0}
.name{display:flex; align-items:center; gap:6px; font-size:13px; min-width:0}
.name b{font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:260px}
.err-text{color:var(--color-error); font-size:12px}
.notice-bar{
  border:1px solid #ece0c6; background:#fdfaf2; color:#6b5424; font-size:12px;
  padding:8px 12px; border-radius:2px;
}
.fade-in{animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0; transform:translateY(3px)} to{opacity:1; transform:none}}
/* ===== 首页 ===== */
.chat-main{display:flex; flex-direction:column; height:100%; background:var(--color-surface)}
.chat-header{
  flex:0 0 auto; height:52px; display:flex; align-items:center; gap:10px;
  padding:0 32px; border-bottom:1px solid var(--color-border); background:var(--color-surface);
}
.chat-title{font-size:13.5px; font-weight:600}
.chat-header-meta{font-size:11.5px; color:var(--color-text-secondary)}
.chat-scroll{flex:1; min-height:0; overflow:auto; padding:0}
.chat-inner{max-width:980px; margin:0 auto; padding:20px 24px 28px}
/* 首页第一屏（会话为空时） */
.welcome{padding:14px 0 6px; max-width:900px}
.welcome h1{margin:0 0 8px; font-size:29px; font-weight:700; letter-spacing:-.01em; line-height:1.3}
.welcome .lead{margin:0 0 22px; font-size:13px; line-height:1.85; color:var(--color-text-secondary); max-width:700px}
.welcome .card-title{margin:22px 0 10px; font-size:13px}
.quick{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px}
.welcome .card{cursor:pointer}
.welcome .card:hover{border-color:var(--color-dark)}
.welcome .notice{margin-top:20px; border:1px solid #ece0c6; background:#fdfaf2; color:#6b5424; padding:9px 12px; border-radius:2px; font-size:11.5px}
.chat-head{
  flex:0 0 auto; height:52px; display:flex; align-items:center; gap:10px;
  padding:0 32px; border-bottom:1px solid var(--color-border); background:var(--color-surface);
}
.chat-head h2{margin:0; font-size:13.5px; font-weight:600}
.chat-head .meta{font-size:11.5px; color:var(--color-text-secondary)}
.chat{display:flex; flex-direction:column; height:100%}
.chat-foot{border-top:1px solid var(--color-border); background:var(--color-surface); padding:10px 24px 12px}
.chat-foot .composer{border:0; padding:0}
.chat-foot textarea{
  width:100%; border:1px solid var(--color-border); border-radius:2px; resize:none;
  padding:9px 11px; font-family:inherit; font-size:13.5px; line-height:1.7; min-height:54px;
}
.chat-foot textarea:focus{outline:none; border-color:var(--color-dark)}
.composer-bar{display:flex; align-items:center; gap:8px; margin-top:6px}
.msg{display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--color-divider)}
.msg .who{
  flex:0 0 26px; height:26px; border-radius:2px; display:flex; align-items:center; justify-content:center;
  font-size:11px; background:#f0f0f0; color:var(--color-text-secondary);
}
.msg.assistant .who{background:var(--color-dark); color:#fff}
.msg .body{flex:1; min-width:0}
.msg .bubble{font-size:13.5px; line-height:1.8; white-space:pre-wrap; word-break:break-word}
.msg .bubble b{font-weight:600}
.pager{display:flex; align-items:center; gap:8px; margin-top:8px}
.empty{padding:20px; text-align:center; color:var(--color-text-secondary); font-size:12.5px}
.navbar .brand{cursor:pointer}
.home-scroll{padding:0}
.home-wrap{max-width:940px; margin:0 auto; padding:30px 24px 40px}
.home-head{margin-bottom:20px}
.home-hello{font-size:12px; color:var(--color-text-secondary); margin-bottom:4px}
.home-title{margin:0; font-size:29px; font-weight:700; letter-spacing:-.01em; line-height:1.3}
.home-sub{margin:8px 0 0; font-size:13px; line-height:1.85; color:var(--color-text-secondary); max-width:720px}
.home-stats{
  display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:1px;
  background:var(--color-border); border:1px solid var(--color-border); margin-bottom:22px;
}
.home-stat{
  appearance:none; border:0; background:var(--color-surface); padding:12px 14px; text-align:left;
  cursor:pointer; display:flex; flex-direction:column; gap:2px; transition:background .12s;
}
.home-stat:hover{background:#fafafa}
.home-stat b{font-family:var(--font-mono); font-size:23px; font-weight:700; line-height:1.2}
.home-stat i{font-style:normal; font-size:11.5px; color:var(--color-text-secondary)}
.home-block{margin-bottom:22px}
.home-block-head{
  display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; margin-bottom:10px;
}
.home-block-head em{margin-left:auto; font-style:normal; font-size:11px; color:var(--color-text-secondary); font-weight:400}
.home-ops{display:flex; flex-wrap:wrap; gap:8px}
.home-op{
  appearance:none; border:1px solid var(--color-border); background:var(--color-surface);
  padding:6px 11px; border-radius:2px; font-size:12.5px; cursor:pointer; color:var(--color-text);
  transition:border-color .12s,background .12s;
}
.home-op:hover{border-color:var(--color-dark); background:#fafafa}
.home-op-note{margin-top:10px; font-size:11.5px; color:var(--color-text-secondary)}
.home-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:10px}
.home-card{
  appearance:none; text-align:left; display:flex; gap:10px; align-items:flex-start;
  border:1px solid var(--color-border); background:var(--color-surface); padding:13px 14px;
  border-radius:2px; cursor:pointer; transition:border-color .12s;
}
.home-card:hover{border-color:var(--color-dark)}
.home-card-icon{font-size:14px; line-height:1.4}
.home-card-body{display:flex; flex-direction:column; gap:3px}
.home-card-body b{font-size:13px; font-weight:600}
.home-card-body i{font-style:normal; font-size:11.5px; color:var(--color-text-secondary); line-height:1.6}
.home-tags{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px}
.home-links{display:flex; flex-wrap:wrap; gap:8px}
.home-foot{
  margin-top:6px; border:1px solid #ece0c6; background:#fdfaf2; border-radius:2px;
  padding:9px 12px; font-size:11.5px; color:#6b5424;
}
.home-foot a{color:inherit}
/* ===== 聊天消息 ===== */
.msg-row{display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--color-divider)}
.msg-avatar{
  flex:0 0 26px; height:26px; border-radius:2px; display:flex; align-items:center; justify-content:center;
  font-size:11px; background:#f0f0f0; color:var(--color-text-secondary);
}
.role-assistant .msg-avatar{background:var(--color-dark); color:#fff}
.msg-body{flex:1; min-width:0}
.msg-bubble{font-size:13.5px; line-height:1.8; white-space:pre-wrap; word-break:break-word}
.msg-bubble b{font-weight:600}
.msg-meta{font-size:11px; color:var(--color-text-secondary); margin-top:6px}
/* ===== 操作卡 ===== */
.op-card{border:1px solid var(--color-border); border-radius:2px; margin-top:10px; background:var(--color-surface)}
.op-card.state-awaiting_confirm{border-color:#e2cf9f; background:#fffdf7}
.op-card.state-failed{border-color:#eed3d3}
.op-head{display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--color-divider)}
.op-area{font-size:10.5px; letter-spacing:.05em; color:var(--color-text-secondary); border:1px solid var(--color-border); padding:2px 6px; border-radius:2px}
.op-title{font-size:13px; font-weight:600}
.op-state{margin-left:auto; font-size:11.5px; color:var(--color-text-secondary); display:flex; align-items:center; gap:5px}
.op-body{padding:11px 12px}
.op-details{margin:0 0 8px; padding-left:18px; font-size:12.5px; color:#404040}
.op-warning{font-size:12px; color:#8a6d1f; background:#fdf6e3; border:1px solid #ece0c6; padding:7px 9px; border-radius:2px; margin-bottom:8px}
.op-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.op-running{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--color-text-secondary)}
.op-result{display:flex; flex-direction:column; gap:8px}
.op-summary{font-size:12.5px}
.op-output{margin:0; padding-left:18px; font-size:12.5px; color:#404040}
.op-stats{display:flex; flex-wrap:wrap; gap:8px}
.op-stat{display:flex; flex-direction:column; border:1px solid var(--color-border); padding:5px 9px; border-radius:2px; min-width:74px}
.op-stat b{font-family:var(--font-mono); font-size:15px; line-height:1.3}
.op-stat i{font-style:normal; font-size:10.5px; color:var(--color-text-secondary)}
.op-link{font-size:12.5px; color:var(--color-dark); text-decoration:underline}
.spinner{
  display:inline-block; width:11px; height:11px; border:1.6px solid var(--color-border);
  border-top-color:var(--color-dark); border-radius:50%; animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* ===== 输入区 ===== */
.composer{flex:0 0 auto; border-top:1px solid var(--color-border); background:var(--color-surface); padding:10px 24px 12px}
.composer-inner{max-width:980px; margin:0 auto}
.composer-hint{display:flex; align-items:center; gap:10px; font-size:11px; color:var(--color-text-secondary); margin-bottom:6px}
.composer-hint-main{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.composer-box{border:1px solid var(--color-border); border-radius:2px; background:#fff}
.composer-box:focus-within{border-color:var(--color-dark)}
.composer-input{
  width:100%; border:0; resize:none; padding:9px 11px 4px; font-family:inherit; font-size:13.5px;
  line-height:1.7; background:transparent; color:var(--color-text); min-height:52px;
}
.composer-actions{display:flex; align-items:center; gap:8px; padding:6px 9px 8px}
.composer-left{display:flex; align-items:center; gap:6px; flex:1; min-width:0}
.composer-right{display:flex; align-items:center; gap:6px}
/* ===== 表格 ===== */
.table{width:100%; border-collapse:collapse; font-size:12.5px}
.table th{
  text-align:left; font-weight:500; color:var(--color-text-secondary); font-size:11.5px; padding:8px 10px;
  border-bottom:1px solid var(--color-border); background:#fcfcfc; white-space:nowrap;
}
.table td{padding:9px 10px; border-bottom:1px solid var(--color-divider); vertical-align:middle}
.table tr:hover td{background:#fcfcfc}
.table tr.row-on td{background:#fbfbfb}
.table-actions{display:flex; flex-wrap:wrap; gap:8px}
.table-actions button{
  appearance:none; border:0; background:none; padding:0; font-size:12px; color:var(--color-text-secondary);
  cursor:pointer; text-decoration:underline; text-underline-offset:3px;
}
.table-actions button:hover{color:var(--color-dark)}
.search-box{display:flex; gap:8px}
.search-box input{flex:1; min-width:0}
.segmented{display:inline-flex; background:#f0f0f0; padding:2px; border-radius:2px}
.segmented button{
  appearance:none; border:0; background:transparent; font-size:12.5px; padding:5px 14px;
  cursor:pointer; border-radius:2px; color:var(--color-text-secondary);
}
.segmented button:hover{color:var(--color-text)}
.segmented button.on{background:var(--color-surface); color:var(--color-text); font-weight:600}
.pager button{margin-left:0}
.table input[type="checkbox"],.content input[type="checkbox"]{accent-color:var(--color-dark)}
.quick-chip{
  appearance:none; border:1px solid var(--color-border); background:#fff; border-radius:2px;
  padding:3px 9px; font-size:11.5px; color:var(--color-text-secondary); cursor:pointer;
}
.quick-chip:hover{border-color:var(--color-dark); color:var(--color-dark)}
/* ===== 检索结果 ===== */
.result{border:1px solid var(--color-border); border-radius:2px; padding:12px 14px; margin-bottom:10px; background:#fff}
.result .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11.5px; color:var(--color-text-secondary)}
.result .chunk{margin-top:8px; font-size:12.5px; line-height:1.8; border-left:2px solid var(--color-dark); padding-left:12px; color:#404040}
.result em{background:var(--color-dark); color:#fff; font-style:normal; padding:0 2px}
/* ===== 时间线 ===== */
.timeline{border-left:1px solid var(--color-border); margin-left:4px; padding-left:14px}
.ev{position:relative; padding:6px 0; font-size:12.5px}
.ev::before{content:""; position:absolute; left:-19px; top:11px; width:7px; height:7px; border-radius:50%; background:#c4c4c4; border:1px solid #fff}
.ev .kvs{font-size:11px; color:var(--color-text-secondary)}
.kvs{display:flex; gap:10px; flex-wrap:wrap}
/* ===== 弹层 ===== */
.mask{position:fixed; inset:0; background:rgba(0,0,0,.32); z-index:2000; display:flex; align-items:center; justify-content:center; padding:24px}
.modal{background:#fff; border-radius:2px; width:min(880px,96vw); max-height:88vh; display:flex; flex-direction:column}
.modal-head{display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--color-border)}
.modal-body{padding:16px; overflow:auto; flex:1}
.modal-foot{padding:10px 16px; border-top:1px solid var(--color-border); display:flex; justify-content:flex-end; gap:8px}
.paper{font-size:13px; line-height:1.85; color:#333}
.paper h3{font-size:13px; margin:14px 0 6px}
.paper table{border-collapse:collapse; font-size:12px; margin-bottom:8px}
.paper th,.paper td{border:1px solid var(--color-border); padding:5px 9px}
.toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(8px); z-index:3000;
  background:var(--color-dark); color:#fff; font-size:12.5px; padding:8px 14px; border-radius:2px;
  opacity:0; pointer-events:none; transition:opacity .18s,transform .18s;
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
/* ===== 窄屏 ===== */
@media (max-width:960px){

  let v = bytes, i = 0;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i += 1; }
  return (i === 0 ? v : v.toFixed(1)) + ' ' + u[i];
}

const extOf = (name) => (name.split('.').pop() || '').toLowerCase();
function fileType(name) {
  const e = extOf(name);
  if (['doc', 'docx'].includes(e)) return 'docx';
  if (['ppt', 'pptx'].includes(e)) return 'pptx';
  if (['xls', 'xlsx', 'csv'].includes(e)) return 'xlsx';
  if (['png', 'jpg', 'jpeg'].includes(e)) return 'image';
  if (['md', 'txt'].includes(e)) return 'txt';
  return e;
}
const TYPE_ICON = { pdf: '▬', docx: '▭', pptx: '▮', xlsx: '▯', image: '◪', txt: '▫' };

function libraryOf(dir) {
  return String(dir || '').split('/')[0].trim() || '未归档';
}
function knownLibraries() {
  const out = LIBRARIES.slice();
  FILES.forEach((f) => {
    const name = libraryOf(f.directory_path);
    if (name && !out.includes(name)) out.push(name);
  });
  return out;
}
function libraryCounts() {
  const m = {};
  FILES.forEach((f) => {
    const name = libraryOf(f.directory_path);
    m[name] = (m[name] || 0) + 1;
  });
  return m;
}
function registerLibrary(name) {
  const n = String(name || '').trim();
  if (!n || n === '未归档') return null;
  if (!LIBRARIES.includes(n)) { LIBRARIES.push(n); persist(); }
  return n;
}

function buildFiles() {
  const now = Date.now();
  return SEEDS.map((s, i) => {
    const [name, dir, size, status, chunks, minutes, customer, department, nature, amount, materialId, error] = s;
    const done = status === 'completed' || status === 'archived';
    return {
      id: materialId ? `file-${materialId}` : `file-demo-${String(i + 1).padStart(3, '0')}`,
      original_name: name,
      file_type: fileType(name),
      file_size: size,
      status,
      error_message: error,
      chunk_count: chunks,
      character_count: chunks * CHUNK,
      directory_path: dir,
      customer, department, nature,
      amount_wan: amount,
      material_id: materialId || undefined,
      source: materialId ? 'session' : 'index',
      progress: status === 'processing' ? 42 : undefined,
      created_at: new Date(now - minutes * 60000).toISOString(),
      updated_at: new Date(now - minutes * 30000).toISOString(),
      parsed_at: done ? new Date(now - minutes * 45000).toISOString() : undefined,
      summary: `${nature}，共 ${chunks} 段，来源：${materialId ? '示例资料' : '目录索引'}`,
    };
  });
}

let LIBRARIES = BUILTIN_LIBS.slice();
let FILES = buildFiles();
let currentLibrary = BUILTIN_LIBS[0];
let TASKS = [];                       // 添加卡：一句话把资料加进信息库
let ANNOS = [
  { id: 'anno-demo-001', query: '质保期多久', file_id: 'file-demo-006', file_name: '华东石化检维修服务合同.pdf',

  { id: 'anno-demo-002', query: '预付款比例', file_id: 'file-demo-010', file_name: '浙能电厂密封改造合同.pdf',
    rating: 'accurate', issues: '', status: 'done', result_note: '已人工复核：与合同第 4.2 条一致', created_at: new Date(Date.now() - 7200e3).toISOString() },

];
const SERVERS = {

  database: { type: 'ChromaDB', url: '本地模拟（原型不联网）', vector: 'HNSW' },
  storage: { type: '本地资料库', endpoint: 'D:\\AProjectScript\\RagSystem\\data', bucket: 'knowledge-base' },

/* ---------------- 3. 内存 API（读操作直读，写操作串行） ---------------- */
let writeChain = Promise.resolve();
function serializeWrite(task) {
  const run = writeChain.then(task, task);
  writeChain = run.catch(() => {});
  return run;
}
function fileById(id) { return FILES.find((f) => f.id === id); }
function touch(f) { f.updated_at = new Date().toISOString(); }
const isSessionFile = (f) => Boolean(f.material_id);

const api = {
  async listFiles({ page = 1, page_size = 10, status, file_type, keyword, session_only, library, sort_by = 'updated_at', order = 'desc' } = {}) {
    const kw = (keyword || '').trim().toLowerCase();
    let items = FILES.filter((f) => {
      if (status && status !== 'all' && f.status !== status) return false;
      if (file_type && file_type !== 'all' && f.file_type !== file_type) return false;
      if (session_only && !isSessionFile(f)) return false;
      if (library && libraryOf(f.directory_path) !== library) return false;
      if (kw) {
        const hay = [f.original_name, f.directory_path, f.customer, f.department].join(' ').toLowerCase();
        if (!hay.includes(kw)) return false;
      }
      return true;
    });
    items = items.slice().sort((a, b) => {
      const va = a[sort_by] || '', vb = b[sort_by] || '';
      const c = va < vb ? -1 : va > vb ? 1 : 0;
      return order === 'asc' ? c : -c;
    });
    const total = items.length;
    const start = (page - 1) * page_size;
    return { total, page, page_size, items: items.slice(start, start + page_size) };
  },
  async getFileStats() {
    const by_status = {};
    STATUS_ORDER.forEach((s) => { by_status[s] = FILES.filter((f) => f.status === s).length; });
    return {
      total_files: FILES.length,
      total_size: FILES.reduce((n, f) => n + f.file_size, 0),
      total_chunks: FILES.reduce((n, f) => n + f.chunk_count, 0),
      by_status,
      by_type: FILES.reduce((m, f) => (m[f.file_type] = (m[f.file_type] || 0) + 1, m), {}),
    };
  },
  async getFileDetail(id) { return fileById(id); },
  async uploadFile(name, size) {
    return serializeWrite(async () => {
      await sleep(320);
      const f = {
        id: uid('file'), original_name: name, file_type: fileType(name), file_size: size,
        status: 'pending', chunk_count: 0, character_count: 0, directory_path: `${registerLibrary(currentLibrary) || '未归档'}/页面内上传`,
        customer: '集团内部', department: '产品部', nature: '页面内上传', amount_wan: 0,
        material_id: uid('mat'), source: 'upload',
        created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
        summary: '页面内上传，尚未处理',
      };
      FILES.unshift(f);
      MATERIALS.unshift({ id: f.material_id, name: f.original_name, fileId: f.id, source: 'upload' });
      return { ok: true, file: f };
    });
  },
  async fileAction(id, action) {
    return serializeWrite(async () => {
      await sleep(240);
      const f = fileById(id);
      if (!f) throw new Error('资料不存在');
      if (action === 'delete') {
        const mat = f.material_id;
        FILES = FILES.filter((x) => x.id !== id);
        if (mat) MATERIALS = MATERIALS.filter((m) => m.id !== mat);
        return { ok: true, deleted: 1 };
      }
      if (action === 'parse' || action === 'retry') {
        f.status = 'processing'; f.progress = 30; f.error_message = undefined; touch(f);
        await sleep(420);
        f.status = 'completed'; f.progress = undefined;
        f.chunk_count = Math.max(4, Math.round(f.file_size / 65536) + 6);
        f.character_count = f.chunk_count * CHUNK;
        f.parsed_at = new Date().toISOString();
        touch(f);
        AGENT.events.unshift({ time: new Date().toISOString(), type: 'task', message: `「${f.original_name}」处理完成（${f.chunk_count} 段）` });
        return { ok: true };
      }
      return { ok: false };
    });
  },
  async batchDeleteFiles(ids) {
    return serializeWrite(async () => {
      await sleep(260);
      const mats = FILES.filter((f) => ids.includes(f.id)).map((f) => f.material_id).filter(Boolean);
      const deleted = FILES.filter((f) => ids.includes(f.id)).length;
      FILES = FILES.filter((f) => !ids.includes(f.id));
      MATERIALS = MATERIALS.filter((m) => !mats.includes(m.id));
      return { ok: true, deleted };
    });
  },
  async search({ q = '', mode = 'hybrid', file_type, department, customer, nature, time_start, time_end, amount_min, amount_max, page = 1, page_size = 10 } = {}) {
    const t0 = Date.now();
    await sleep(260);
    const kw = q.trim();
    const modeKey = mode === 'filename' || mode === 'name' ? 'name' : mode === 'content' ? 'content' : 'all';
    const hasStructured = Boolean(department || customer || nature || (file_type && file_type !== 'all'));
    const minScore = kw ? 0.85 : hasStructured ? 0.3 : modeKey === 'content' ? 0.4 : 0.42;

    const results = [];
    for (const f of FILES) {
      if (f.status === 'failed' || f.status === 'archived') continue;
      if (file_type && file_type !== 'all' && f.file_type !== file_type) continue;
      if (department && f.department !== department) continue;
      if (customer && f.customer !== customer) continue;
      if (nature && f.nature !== nature) continue;
      if (time_start && (f.parsed_at || f.created_at).slice(0, 10) < time_start) continue;
      if (time_end && (f.parsed_at || f.created_at).slice(0, 10) > time_end) continue;
      if (amount_min != null && (f.amount_wan || 0) < amount_min) continue;
      if (amount_max != null && (f.amount_wan || 0) > amount_max) continue;

      const nameHit = kw ? f.original_name.toLowerCase().includes(kw.toLowerCase()) || f.directory_path.toLowerCase().includes(kw.toLowerCase()) : true;
      const paragraphs = paragraphsOf(f);
      const bodyHits = kw ? paragraphs.filter((p) => p.includes(kw)) : paragraphs.slice(0, hasStructured || !kw ? 1 : 0);
      if (kw && modeKey !== 'name' && bodyHits.length === 0 && !nameHit) continue;
      if (kw && modeKey === 'name' && !nameHit) continue;
      if (!kw && !hasStructured && modeKey === 'content') { /* 空查询浏览正文模式：列出全部段落首段 */ }

      if (nameHit || bodyHits.length > 0) {
        results.push({
          file_id: f.id, file_name: f.original_name, file_type: f.file_type,
          chunk_text: bodyHits[0] || `${f.original_name}：${f.summary || ''}`,
          score: nameHit ? 0.99 : Math.min(0.97, 0.72 + bodyHits.length * 0.02),
          source_page: 1, source_section: f.nature, nature: f.nature, nature_confidence: 0.92,
          contract_info: f.amount_wan ? { contract_name: f.original_name, customer_name: f.customer, amount: f.amount_wan, department: f.department } : undefined,
          highlight: kw, from_cache: false, reranked: true,
          file_time: f.parsed_at || f.created_at,
        });
      }
    }
    results.sort((a, b) => b.score - a.score);
    const a = (page - 1) * page_size;
    return {
      query: q, mode: modeKey === 'name' ? 'filename' : modeKey, total: results.length, all_total: results.length,
      took_ms: Date.now() - t0, page, page_size, results: results.slice(a, a + page_size),
    };
  },
  async submitAnnotation({ query, file_id, rating, issues }) {
    return serializeWrite(async () => {
      await sleep(200);
      const f = fileById(file_id);
      const id = uid('anno');
      ANNOS.unshift({
        id, query, file_id, file_name: f ? f.original_name : file_id, rating, issues: issues || '',
        status: 'pending', result_note: '', created_at: new Date().toISOString(),
      });
      AGENT.events.unshift({ time: new Date().toISOString(), type: 'annotation', message: `收到检索反馈（${rating === 'accurate' ? '准确' : '不准确'}）：${query || '未填写检索词'}` });
      return { ok: true, id };
    });
  },
  async listAnnotations() { return { items: ANNOS.slice(0, 100) }; },
  async processAnnotation(id, note) {
    return serializeWrite(async () => {
      await sleep(200);
      const a = ANNOS.find((x) => x.id === id);
      if (a) { a.status = 'done'; a.result_note = note || '已人工复核'; }

  },
  async runAgentAction(action) {
    return serializeWrite(async () => {
      await sleep(360);
      const label = AGENT_ACTIONS[action] || action;
      if (action === 'restart_stuck') AGENT.watchdog.restart_count += 1;
      if (action === 'clear_circuit') AGENT.circuit_breaker.failures = 0;
      AGENT.events.unshift({ time: new Date().toISOString(), type: 'watchdog', message: `${label}：本地模拟执行完成` });
      return { ok: true, message: `${label} 已完成（本地模拟）` };
    });
  },
  async testRemoteModel(type) {
    return serializeWrite(async () => {
      await sleep(420);
      const s = SERVERS[type];
      if (!s) return { ok: false, error: '未知模型类型' };
      SERVERS[type] = { ...s, latency_ms: 18 + Math.round(Math.random() * 40) };
      return { ok: true, latency_ms: SERVERS[type].latency_ms };
    });
  },
  async toggleModel(type, mode) {
    return serializeWrite(async () => {
      await sleep(260);

      CONFIG.local_model.embedding_mode = mode;
      return { ok: true };
    });
  },
  async startLocalModel() {
    return serializeWrite(async () => {
      await sleep(600);
      const lm = CONFIG.local_model;
      lm.active = true; lm.embedding_mode = 'local';
      lm.bge = { ...lm.bge, loaded: true, dim: lm.total_dim };
      lm.qwen = { ...lm.qwen, loaded: true };
      lm.llm = { ...lm.llm, available: true, running: true, standby: false };
      return { ok: true };
    });
  },
  async indexFolder(path) {
    return serializeWrite(async () => {
      await sleep(500);
      return { ok: true, folder_path: path, count: 3 };
    });
  },
};

function buildAnswer(kind, q) {

/* ---------------- 6. 操作指令解析（一句话做事） ---------------- */
const has = (text, ...words) => words.some((w) => text.includes(w));
function quotedNames(text) {
  const out = [];
  const re = /[「“"'《]([^」”"'》]+)[」”"'》]/g;
  let m;
  while ((m = re.exec(text))) out.push(m[1]);
  return out;
}
function statusWords(text) {
  if (has(text, '失败', '报错')) return 'failed';
  if (has(text, '待处理', '等待处理', '还没处理')) return 'pending';
  if (has(text, '处理中', '正在处理')) return 'processing';
  if (has(text, '已完成', '完成了', '处理完成')) return 'completed';
  if (has(text, '归档')) return 'archived';
  return null;
}
function matchFiles(text, files) {
  const named = quotedNames(text);
  const hits = new Map();
  for (const f of files) {
    const blob = text.toLowerCase();
    const full = f.original_name.toLowerCase();
    const stem = full.replace(/\.[a-z0-9]+$/, '');
    if (named.some((n) => full.includes(n.toLowerCase()) || n.toLowerCase().includes(stem))) hits.set(f.id, f);
    else if (stem.length >= 4 && blob.includes(stem)) hits.set(f.id, f);
  }
  return [...hits.values()];
}
function cluster(status, count) {
  return { status, count };
}
function parseOperation(text, files, ctx) {
  const t = text.trim();
  if (!t) return null;

  // 帮助
  if (has(t, '你能做什么', '会做什么', '怎么用', '帮助', '使用说明', '能帮我做什么', '支持哪些')) {
    return {
      kind: 'help', area: 'kb', title: '我能帮你做的事', confirm: 'none', params: {},
      details: [
        '文件：列出资料、看某份资料详情、上传、解析/重试、删除、按目录索引',

        '运维：看运行状态、立即巡检、重启停滞任务、重置熔断器、触发学习、重扫反馈',
        '配置：看模型状态、测试向量/OCR/大模型连通、启动本地模型、切换远程/本地',
        '不可撤销的动作（删除、切换模型）会先出一张卡，你点「确认执行」才会真的动。',
      ],
    };
  }

  // 纯疑问句交给提问链路（带明确动作的例外）
  if (/^(怎么|如何|为什么|什么|是否|能否|能不能|可以吗)/.test(t) || /[？?]$/.test(t)) {
    if (!has(t, '帮我删', '删掉', '删除', '执行', '跑一下', '做一下', '搜索', '检索', '查找', '找一下', '帮我找', '找找', '搜一下')) return null;
  }

  /* —— 文件 —— */
  const selected = ctx.selectedFileIds || [];
  if (has(t, '预览', '打开看一下', '打开看看', '看一眼')) {
    const target = matchFiles(t, files)[0] || files.find((f) => selected.includes(f.id));
    if (target) return { kind: 'open_preview', area: 'file', title: `预览 ${target.original_name}`, confirm: 'none', details: [target.directory_path], params: { fileId: target.id, name: target.original_name } };
  }
  if (has(t, '上传', '添加文件', '导入文件')) {
    return { kind: 'upload_files', area: 'file', title: '上传资料', confirm: 'none', params: { pick: 'file' },
      details: ['浏览器里必须由你亲自选中文件，我不能凭空造出一份资料。', '页面右上角的「上传资料」按钮就是入口。'] };
  }
  if (has(t, '索引', '扫描目录', '扫目录')) {
    const folder = quotedNames(t)[0] || '项目信息库';
    return { kind: 'index_folder', area: 'file', title: `索引目录「${folder}」`, confirm: 'card', params: { folderPath: folder, recursive: !has(t, '不递归', '只第一层') },
      details: [`目录：${folder}`, has(t, '不递归', '只第一层') ? '范围：只第一层' : '范围：含子目录', '索引只新增目录里还没有的资料。'],
      warning: '索引会往资料库里写入新记录，先确认目录没选错。' };
  }
  if (has(t, '重试', '重新解析')) {
    const failed = files.filter((f) => f.status === 'failed');
    const targets = matchFiles(t, files);
    const list = targets.length ? targets : (failed.length ? failed : files.filter((f) => selected.includes(f.id)));
    if (list.length) return { kind: 'retry_files', area: 'file', title: `重新处理 ${list.length} 份资料`, confirm: 'none', params: { fileIds: list.map((f) => f.id) }, details: list.slice(0, 6).map((f) => f.original_name) };
  }
  if (has(t, '解析', '处理一下', '开始处理')) {
    const targets = matchFiles(t, files);
    const list = targets.length ? targets : files.filter((f) => f.status === 'pending' || selected.includes(f.id));
    if (list.length) return { kind: 'parse_files', area: 'file', title: `处理 ${list.length} 份资料`, confirm: 'none', params: { fileIds: list.map((f) => f.id) }, details: list.slice(0, 6).map((f) => f.original_name) };
  }
  if (has(t, '删除', '删掉', '清掉')) {
    const targets = matchFiles(t, files);
    let list = targets;
    if (!list.length) list = files.filter((f) => selected.includes(f.id));
    if (!list.length && has(t, '失败')) list = files.filter((f) => f.status === 'failed');
    if (!list.length) {
      return { kind: 'list_files', area: 'file', title: '不知道要删除哪些资料', confirm: 'none', params: {},

      details: list.slice(0, 8).map((f) => `${f.original_name}（${f.directory_path}）`),
      warning: '删除后它们会同时从检索范围里消失，并且不可撤销。' };
  }
  if (has(t, '详情', '看一下信息', '资料信息')) {
    const target = matchFiles(t, files)[0];
    if (target) return { kind: 'file_detail', area: 'file', title: `查看 ${target.original_name}`, confirm: 'none', params: { fileId: target.id }, details: [target.directory_path] };
  }
  if (has(t, '列出', '有哪些', '都有什么', '清单', '列表', '看看资料', '列一下')) {
    const status = statusWords(t);
    const sessionOnly = has(t, '会话', '示例资料', 'AI');
    return { kind: 'list_files', area: 'file', title: status ? `列出「${STATUS_TEXT[status]}」的资料` : sessionOnly ? '列出会话里的资料' : '列出资料库里的资料',
      confirm: 'none', params: { status, sessionOnly }, details: [status ? `状态：${STATUS_TEXT[status]}` : '范围：全部资料', sessionOnly ? '只看 AI 会话加进来的那批' : ''] .filter(Boolean) };
  }

  /* —— 运维 —— */
  if (has(t, '运维', '看门狗', '巡检', '健康', 'agent', '停滞', '熔断', '运行状态', '运行情况')) {
    const map = [['巡检', 'scan'], ['重启', 'restart_stuck'], ['停滞', 'restart_stuck'], ['熔断', 'clear_circuit'], ['学习', 'learn'], ['反馈', 'rescan_annotations'], ['重扫', 'rescan_annotations']];
    const hit = map.find(([k]) => t.includes(k));
    const isAction = hit && has(t, '执行', '跑一下', '做一下', '现在', '帮我', '一下', '重启', '重置', '触发', '重扫') && !has(t, '看看', '查看', '怎么样', '状态');
    if (isAction) {
      return { kind: 'agent_action', area: 'agent', title: AGENT_ACTIONS[hit[1]], confirm: 'none', params: { action: hit[1] },
        details: ['在本地模拟环境里执行，不会真的重启服务。'] };
    }
    return { kind: 'agent_status', area: 'agent', title: '看运行状态', confirm: 'none', params: {}, details: ['看门狗心跳、熔断器、最近事件'] };
  }

  /* —— 配置 —— */
  if (has(t, '模型', '向量服务', '向量', '模式', '维度', 'ocr', 'embedding', 'bge', 'qwen', '大模型', '连通', '配置')) {
    const type = has(t, 'ocr') ? 'ocr' : has(t, '大模型', 'llm', 'qwen') ? 'llm' : 'embedding';
    const isSwitch = has(t, '切换', '改成', '换成', '切到', '关掉', '停用', '关闭', '换成远程');
    if (has(t, '测试', '连通', '通不通', '能不能连')) {

    }
    // 「切换成本地推理」是切换语义，不能被「本地」两个字抢成"启动本地模型"
    if (isSwitch) {
      const mode = has(t, '关掉', '停用', '关闭', '不启动', '别启动') ? 'off' : has(t, '本地') ? 'local' : 'remote';
      return { kind: 'toggle_model', area: 'settings', title: `把向量模式切换为${mode === 'local' ? '本地推理' : mode === 'off' ? '停用' : '远程接口'}`,
        confirm: 'card', params: { type: 'embedding', mode }, details: ['影响后续新增资料的向量生成方式。'], warning: '切换会改变入库方式，先确认当前没有正在解析的资料。' };
    }
    if (has(t, '启动本地', '本地模型')) {

    }

  }

  /* —— 搜索 / 反馈 —— */
  if (has(t, '反馈', '批注') || (has(t, '不准确', '准确') && has(t, '标记', '反馈', '这条'))) {
    const rating = has(t, '不准确', '不对', '错') ? 'inaccurate' : 'accurate';
    return { kind: 'annotate', area: 'search', title: `提交一条「${rating === 'accurate' ? '准确' : '不准确'}」反馈`, confirm: 'card', params: { query: quotedNames(t)[0] || '', rating },
      details: ['反馈会写进 Agent 控制台的批注列表，供人工复核。'], warning: '提交后这条反馈会进入重扫队列。' };
  }
  const hasFilter = has(t, '筛选', '过滤', '只看', '按部门', '按客户', '金额', '大于', '小于', '日期', '最近');
  const searchVerb = has(t, '搜索', '检索', '查找', '找一下', '帮我找', '找找', '搜一下');
  if (hasFilter && (searchVerb || has(t, '只看'))) {
    const amount = /(\d+(?:\.\d+)?)\s*(?:万|万元)/.exec(t);
    const dept = /部门[「“"']?([^」”"'，。；、\s]{2,20})/.exec(t);
    const cust = /(?:客户|甲方)[「“"']?([^」”"'，。；、\s]{2,30})/.exec(t);
    const less = has(t, '小于', '不超过', '低于');
    return { kind: 'search', area: 'search', title: '按条件筛选资料', confirm: 'none',
      params: { q: quotedNames(t)[0] || '', department: dept ? dept[1] : '', customer: cust ? cust[1] : '', amountMin: amount && !less ? Number(amount[1]) : undefined, amountMax: amount && less ? Number(amount[1]) : undefined, mode: 'hybrid' },
      details: [quotedNames(t)[0] ? `关键词：${quotedNames(t)[0]}` : '关键词：无（按条件浏览）', dept ? `归属部门：${dept[1]}` : '', cust ? `客户：${cust[1]}` : '', amount ? `合同金额：${less ? '不超过' : '不少于'} ${amount[1]} 万元` : ''].filter(Boolean) };
  }
  if (searchVerb) {
    const q = quotedNames(t)[0] || (/(?:搜索|检索|查找|找一下|帮我找|找找|搜一下|搜搜)\s*(.*)$/.exec(t) || [, ''])[1]
      .replace(/^(一下|下|看看|看|关于|有关)\s*/, '').replace(/[？?。！!，,；;：:]+$/g, '')
      .replace(/\s*的?\s*(资料|文件|内容|记录)\s*$/g, '').replace(/^(资料|文件|内容)\s*/, '').trim();
    if (q) return { kind: 'search', area: 'search', title: `在资料库里找「${q}」`, confirm: 'none',
      params: { q, mode: has(t, '文件名', '.pdf', '.docx', '.xlsx', '.md') ? 'filename' : 'hybrid' },
      details: [`关键词：${q}`, '范围：文件名 + 正文内容', '只读检索，不会改动任何资料。'] };
  }
  return null;

/* ---------------- 7. 操作执行器 ---------------- */
function dedupeByFile(results, limit = 6) {
  const m = new Map();
  for (const r of results) {
    const hit = m.get(r.file_name);
    if (hit) { hit.hits += 1; hit.score = Math.max(hit.score, r.score); }
    else m.set(r.file_name, { file_name: r.file_name, score: r.score, hits: 1 });
  }
  return [...m.values()].slice(0, limit);
}

const operationRunning = new Set();
const OP_ERROR_TEXT = { file: '这次文件操作没有完成，请换个说法再试一次。', search: '这次检索没有完成，请稍后再试。', agent: '这次运维动作没有完成。', settings: '这次配置操作没有完成。', kb: '这个操作没有完成。' };

function sendUserMessage(sessionId, content) {
  const text = content.trim();
  if (!text) return;
  const seq = nextSeq(sessionId);
  const user = addMessage({ id: uid('msg'), sessionId, role: 'user', content: text, seq, createdAt: Date.now() });
  const session = SESSIONS.find((s) => s.id === sessionId);
  if (session) { session.updatedAt = Date.now(); if (seq <= 2 && (!session.titled || session.title === '演示会话')) { session.title = topicOf(text); session.titled = true; } }

  const selected = $$('.file-check:checked').map((c) => c.value);
  const intent = parseOperation(text, FILES, { selectedFileIds: selected });

  let assistant;
  if (intent) {
    const operation = {
      id: 'op-' + user.id, intent,
      state: intent.confirm === 'card' ? 'awaiting_confirm' : 'pending',
      summary: intent.confirm === 'card' ? '等待你确认后才会执行。' : '准备执行…',
      createdAt: Date.now(),
    };
    const assistantText = intent.confirm === 'card'
      ? ['**这张操作卡还没有执行。**', '', `要做的：${intent.title}`,
         ...(intent.warning ? ['', `警告：${intent.warning}`] : []), '',
         '核对无误就点「确认执行」；点「放弃」不会有任何改动。'].join('\n')
      : intent.kind === 'help' ? '下面这些事你可以直接在这里说一句话完成。' : '好，这就去办，结果马上出来。';
    assistant = addMessage({ id: uid('msg'), sessionId, role: 'assistant', content: assistantText, seq: seq + 1, createdAt: Date.now(), operation });
    if (intent.confirm !== 'card') setTimeout(() => runOperationTask(assistant.id), 60);
  } else {
    const kind = /总结|概览/.test(text) ? 'summary' : /哪些|列出|清单|列表/.test(text) ? 'list' : /依据|引用|原文/.test(text) ? 'cite' : 'search';
    const answer = buildAnswer(kind, text) + '\n\n（以上为本地模拟回答，不联网、不调用真实模型。）';
    assistant = addMessage({ id: uid('msg'), sessionId, role: 'assistant', content: answer, seq: seq + 1, createdAt: Date.now() });
  }
  persist();
  render();
  return { user, assistant };
}

async function runOperationTask(messageId) {
  const msg = MESSAGES[messageId];
  const op = msg && msg.operation;
  if (!op) return;
  if (op.state === 'awaiting_confirm') return;
  if (op.state === 'running' || op.state === 'done' || operationRunning.has(op.id)) return;
  operationRunning.add(op.id);
  patchMessage(messageId, { operation: { ...op, state: 'running', summary: '正在执行…' } });
  render();
  try {
    const out = await runOperation(op.intent);
    const cur = MESSAGES[messageId];
    patchMessage(messageId, {
      operation: {
        ...cur.operation, state: 'done', summary: out.summary, output: out.output, stats: out.stats,
        link: out.link, preview: out.preview, finishedAt: Date.now(),
      },
    });
  } catch (e) {
    const cur = MESSAGES[messageId];
    patchMessage(messageId, { operation: { ...cur.operation, state: 'failed', summary: OP_ERROR_TEXT[op.intent.area], error: String(e && e.message || e), finishedAt: Date.now() } });
  } finally {
    operationRunning.delete(op.id);
    persist();
    render();
  }
}
function confirmOperation(messageId) {
  const msg = MESSAGES[messageId];
  const op = msg && msg.operation;
  if (!op || op.state !== 'awaiting_confirm') return;
  patchMessage(messageId, { operation: { ...op, state: 'pending', summary: '准备执行…' } });
  runOperationTask(messageId);
}
function cancelOperation(messageId) {
  const msg = MESSAGES[messageId];
  const op = msg && msg.operation;
  if (!op || op.state !== 'awaiting_confirm') return;
  patchMessage(messageId, { operation: { ...op, state: 'cancelled', summary: '已放弃这次操作，没有任何改动。', finishedAt: Date.now() } });
  persist(); render();
}
function topicOf(text) {
  const t = text.replace(/[。！？!?，,]/g, ' ').trim();
  return (t.length > 14 ? t.slice(0, 14) + '…' : t) || '新会话';
}

/* ---------------- 9. 持久化 ---------------- */
const STORE_KEY = 'kb-single-file-v1';
function persist() {
  safeStore.set(STORE_KEY, JSON.stringify({
    files: FILES, materials: MATERIALS, sessions: SESSIONS, messages: MESSAGES,
    annos: ANNOS, events: AGENT.events, config: CONFIG, activeSession, libraries: LIBRARIES,
  }));
}
function restore() {
  const raw = safeStore.get(STORE_KEY);
  if (!raw) return false;
  try {
    const s = JSON.parse(raw);
    if (!s.files || !s.files.length) return false;
    FILES = s.files; MATERIALS = s.materials || []; SESSIONS = s.sessions || SESSIONS;
    MESSAGES = s.messages || {}; ANNOS = s.annos || ANNOS; AGENT.events = s.events || AGENT.events;
    Object.assign(CONFIG, s.config || {}); activeSession = s.activeSession || SESSIONS[0].id;
    LIBRARIES = (s.libraries && s.libraries.length) ? s.libraries : LIBRARIES;
    return true;
  } catch (e) { return false; }
}
function resetAll() {
  FILES = buildFiles();
  MATERIALS = FILES.filter(isSessionFile).map((f) => ({ id: f.material_id, name: f.original_name, fileId: f.id, source: 'session' }));
  SESSIONS = [{ id: 'sess-demo', title: '演示会话', createdAt: Date.now(), updatedAt: Date.now() }];
  MESSAGES = {}; activeSession = 'sess-demo'; LIBRARIES = BUILTIN_LIBS.slice();
  ANNOS = ANNOS.slice(); AGENT.events = AGENT_EVENTS.slice();
  safeStore.del(STORE_KEY);
}

          <span class="hint">在你确认之前，不会有任何改动。</span></div>` : ''}
      ${(op.state === 'running' || op.state === 'pending') ? `<div class="op-running"><span class="spinner"></span><span>${esc(op.summary || '')}</span></div>` : ''}
      ${settled ? `<div class="op-result">
          <div class="op-summary">${esc(op.summary || '')}</div>
          ${op.output && op.output.length ? `<ul class="op-output">${op.output.map((o) => `<li>${esc(o)}</li>`).join('')}</ul>` : ''}
          ${op.stats && op.stats.length ? `<div class="op-stats">${op.stats.map((s) => `<span class="op-stat"><b>${esc(s.value)}</b><i>${esc(s.label)}</i></span>`).join('')}</div>` : ''}

          ${op.preview ? `<button class="btn sm" data-preview="${op.preview.fileId}" data-preview-name="${esc(op.preview.name)}">打开预览</button>` : ''}
          ${op.link ? `<a class="op-link" href="${op.link.href}">${esc(op.link.label)} →</a>` : ''}
        </div>` : ''}
    </div>
  </div>`;
}

/* —— 搜索 —— */
function viewSearch() {
  const q = currentRoute.query.get('q') || currentRoute.query.get('keyword') || '';
  const department = currentRoute.query.get('department') || '';
  const customer = currentRoute.query.get('customer') || '';
  const nature = currentRoute.query.get('nature') || '';
  const amountMin = currentRoute.query.get('amount_min') || '';
  const mode = currentRoute.query.get('mode') || 'hybrid';
  const page = Number(currentRoute.query.get('page') || 1);

  const all = FILES.filter((f) => {
    if (f.status === 'failed' || f.status === 'archived') return false;
    if (department && f.department !== department) return false;
    if (customer && f.customer !== customer) return false;
    if (nature && f.nature !== nature) return false;
    if (amountMin && (f.amount_wan || 0) < Number(amountMin)) return false;
    if (!q) return Boolean(department || customer || nature || amountMin);
    const kw = q.toLowerCase();
    const inName = f.original_name.toLowerCase().includes(kw) || f.directory_path.toLowerCase().includes(kw);
    const inBody = paragraphsOf(f).some((p) => p.includes(q));
    if (mode === 'filename') return inName;
    if (mode === 'content') return inBody;
    return inName || inBody;
  });
  const depts = [...new Set(FILES.map((f) => f.department).filter(Boolean))];
  const natures = [...new Set(FILES.map((f) => f.nature).filter(Boolean))];
  const SIZE = 10;
  const rows = all.slice((page - 1) * SIZE, page * SIZE);
  const hist = (safeStore.get('kb-history') || '').split('|').filter(Boolean);

  return `<div class="content fade-in">
    <div class="page-header"><h2>搜索</h2><div class="page-sub">关键词 + 部门 / 客户 / 资料性质 / 金额一起用，筛选在本页真实生效。</div></div>
    <div class="card">
      <div class="search-box">
        <input id="q" value="${esc(q)}" placeholder="搜文件名或正文内容，例如：质保期 / 合同">
        <button class="btn primary" data-search>搜索</button>
      </div>
      <div class="row" style="margin-top:12px">
        <label class="field">模式<select id="mode">
          <option value="hybrid"${mode === 'hybrid' ? ' selected' : ''}>文件名 + 内容</option>
          <option value="filename"${mode === 'filename' ? ' selected' : ''}>只搜文件名</option>
          <option value="content"${mode === 'content' ? ' selected' : ''}>只搜正文</option></select></label>
        <label class="field">归属部门<select id="department"><option value="">不限</option>${depts.map((d) => `<option${d === department ? ' selected' : ''}>${esc(d)}</option>`).join('')}</select></label>
        <label class="field">资料性质<select id="nature"><option value="">不限</option>${natures.map((d) => `<option${d === nature ? ' selected' : ''}>${esc(d)}</option>`).join('')}</select></label>
        <label class="field">金额下限（万元）<input id="amount_min" type="number" value="${esc(amountMin)}" placeholder="不限" style="min-width:110px"></label>
        <button class="btn sm" data-search-apply>应用筛选</button>
        <button class="btn sm" data-search-reset>清空</button>
      </div>
      ${hist.length ? `<div class="row" style="margin-top:10px"><span class="muted tiny">最近搜索：</span>${hist.slice(0, 6).map((h) => `<button class="quick-chip" data-say-search="${esc(h)}">${esc(h)}</button>`).join('')}</div>` : ''}
      <div class="row" style="margin-top:10px"><span class="muted tiny">热词：</span>${['合同', '质保期', '验收', '结算', '采购', '方案'].map((h) => `<button class="quick-chip" data-say-search="${h}">${h}</button>`).join('')}</div>
    </div>
    <div style="margin:16px 0 10px" class="row">
      <span class="card-title" style="margin:0">${q || department || nature || amountMin ? `找到 ${all.length} 条` : '输入关键词或选一个筛选条件'}</span>
      ${department ? `<span class="tag info">部门：${esc(department)}</span>` : ''}
      ${customer ? `<span class="tag info">客户：${esc(customer)}</span>` : ''}
      ${nature ? `<span class="tag info">性质：${esc(nature)}</span>` : ''}
      ${amountMin ? `<span class="tag info">金额 ≥ ${esc(amountMin)} 万</span>` : ''}
    </div>
    ${rows.map((f) => `<div class="result">
      <div class="name"><span class="ic-file t-${esc(f.file_type)}">${TYPE_ICON[f.file_type] || '▫'}</span> ${esc(f.original_name)}</div>
      <div class="chunk">${highlightText(paragraphsOf(f)[0] || f.summary || '', q)}</div>
      <div class="meta">
        <span>${esc(f.directory_path)}</span><span>${esc(f.customer || '集团内部')} · ${esc(f.department || '—')}</span>
        <span>${esc(f.nature || '—')}</span>${f.amount_wan ? `<span>${f.amount_wan.toFixed(1)} 万元</span>` : ''}
        <span>匹配度 ${(0.86 + (f.original_name.length % 10) / 100).toFixed(2)}</span>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" data-preview="${f.id}">预览</button>
        <button class="btn sm" data-anno="${f.id}" data-anno-query="${esc(q || '未填写检索词')}">准确</button>
        <button class="btn sm" data-anno="${f.id}" data-anno-query="${esc(q || '未填写检索词')}" data-anno-rating="inaccurate">不准确</button>
      </div>
    </div>`).join('')}
    ${(q || department || nature || amountMin) && all.length === 0 ? '<div class="empty">没有命中，试试放宽条件或换个词。</div>' : ''}
    ${all.length ? `<div class="pager">
      <span class="muted tiny">共 ${all.length} 条 · 第 ${page} / ${Math.ceil(all.length / SIZE)} 页</span>
      <button class="btn sm" data-search-page="${page - 1}" ${page <= 1 ? 'disabled' : ''}>上一页</button>
      <button class="btn sm" data-search-page="${page + 1}" ${page * SIZE >= all.length ? 'disabled' : ''}>下一页</button>
    </div>` : ''}
  </div>`;
}
function highlightText(text, q) {
  if (!q) return esc(text);
  const safe = esc(text);
  const needle = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(needle, 'g'), (m) => `<em>${m}</em>`);
}

/* —— 使用说明 —— */
function viewDocs() {
  return `<div class="content fade-in">

    <div class="card paper">
      <h3>它是什么</h3>
      <p>把知识库原型的<b>数据层 + 五个页面 + AI 会话操作通道</b>压缩进一个 HTML 文件：双击就能在浏览器里跑，不需要 Node、不需要后端、不联网。数据和 React 版（<code>src/</code>）是同一套口径：24 份演示资料、信息库（可增长）、默认向量维度 ${DIM}。</p>
      <h3>能用一句话做什么</h3>
      <ul>
        <li>找资料：<code>搜一下「质保期」</code>、<code>按部门 项目部 筛选</code>、<code>金额大于 1000 万的资料</code></li>
        <li>看资料：<code>列出失败的资料</code>、<code>列出会话里的资料</code>、<code>看看华东石化检维修服务合同.pdf 的详情</code>、<code>预览 供应商名录 2026.xlsx</code></li>
        <li>改资料：<code>解析待处理的资料</code>、<code>重试失败的资料</code>、<code>删除 质量管理体系文件.pdf</code>（会先出确认卡）</li>
        <li>运维：<code>看看运行状态</code>、<code>帮我巡检一下</code>、<code>重启停滞任务</code>、<code>重置熔断器</code></li>
        <li>配置：<code>测试向量服务连通</code>、<code>启动本地模型</code>、<code>把向量模式切换成本地推理</code>（会先出确认卡）</li>
        <li>反馈：<code>把这条检索标记为不准确</code> → 出现在 Agent 控制台的批注列表</li>
      </ul>
      <h3>安全边界</h3>
      <ul>
        <li>删除、切换模型这类不可撤销动作<b>先出确认卡</b>，点了「确认执行」才会动；点「放弃」没有任何改动。</li>
        <li>上传需要你亲自选本地文件，原型不会凭空造资料，也不会往磁盘写任何文件。</li>
        <li>所有「服务连通」「重启服务」「熔断」都是内存里的状态切换，不会真的发起对外请求。</li>
        <li>AI 会话侧只说日常话；文件管理与系统配置这类管理页保留专业监控用词（看门狗、熔断器、向量维度）。</li>
      </ul>
      <h3>刷新与重置</h3>
      <p>数据存在浏览器 localStorage（<code>file://</code> 下若被限制则退化为内存态，刷新即复位）。右上角「重置演示数据」恢复初始 24 份资料与空白会话。</p>
      <h3>与完整版的差异</h3>
      <ul>
        <li>检索是关键词 + 规则打分，没有真实向量；嵌入维度只作为配置项展示。</li>
        <li>预览是排版模拟（文档段落 / 表格 / 幻灯片 / 图片占位），不解析真实文件字节。</li>
        <li>完整 React 版在 <code>src/</code>：同样的业务口径 + antd 组件 + 逐页验收；这份单文件版用于离线演示与分发。</li>
      </ul>
    </div>

/* —— 分组工具（搜索/文件管理共用） —— */
function groupsBy(key) {
  const map = new Map();
  for (const f of FILES) {
    const k = f[key] || '—';
    const g = map.get(k) || { name: k, files: [], amount: 0 };
    g.files.push(f);
    g.amount += f.amount_wan || 0;
    map.set(k, g);
  }
  return [...map.values()].sort((a, b) => b.files.length - a.files.length);
}

function viewSearch() {
  const q = currentRoute.query.get('q') || currentRoute.query.get('keyword') || '';
  const department = currentRoute.query.get('department') || '';
  const customer = currentRoute.query.get('customer') || '';
  const nature = currentRoute.query.get('nature') || '';
  const amountMin = currentRoute.query.get('amount_min') || '';
  const mode = currentRoute.query.get('mode') || 'hybrid';
  const page = Number(currentRoute.query.get('page') || 1);

  const all = FILES.filter((f) => {
    if (f.status === 'failed' || f.status === 'archived') return false;
    if (department && f.department !== department) return false;
    if (customer && f.customer !== customer) return false;
    if (nature && f.nature !== nature) return false;
    if (amountMin && (f.amount_wan || 0) < Number(amountMin)) return false;
    if (!q) return Boolean(department || customer || nature || amountMin);
    const k = q.toLowerCase();
    const inName = f.original_name.toLowerCase().includes(k) || f.directory_path.toLowerCase().includes(k);
    const inBody = paragraphsOf(f).some((p) => p.includes(q));
    if (mode === 'filename') return inName;
    if (mode === 'content') return inBody;
    return inName || inBody;
  });
  const depts = [...new Set(FILES.map((f) => f.department).filter(Boolean))];
  const natures = [...new Set(FILES.map((f) => f.nature).filter(Boolean))];
  const SIZE = 10;
  const pages = Math.max(1, Math.ceil(all.length / SIZE));
  const cur = Math.min(Math.max(1, page), pages);
  const rows = all.slice((cur - 1) * SIZE, cur * SIZE);
  const hist = (safeStore.get('kb-history') || '').split('|').filter(Boolean);
  const active = Boolean(q || department || customer || nature || amountMin);
  return `<div class="content fade-in">
    <div class="page-header"><h2>搜索</h2><p>关键词 + 部门 / 客户 / 资料性质 / 金额一起用，筛选在本页真实生效。</p></div>
    <div class="card">
      <div class="search-box">
        <input id="q" value="${esc(q)}" placeholder="搜文件名或正文内容，例如：质保期 / 合同">
        <button class="btn primary" data-search>搜索</button>
      </div>
      <div class="row" style="margin-top:12px">
        <label class="field">模式
          <select id="mode">
            <option value="hybrid"${mode === 'hybrid' ? ' selected' : ''}>文件名 + 内容</option>

    </div>`).join('')}
    ${active && all.length === 0 ? '<div class="empty-state" style="text-align:center;padding:30px 0"><p class="muted">没有命中，试试放宽条件或换个词。</p></div>' : ''}
    ${all.length ? `<div class="row pager" style="justify-content:flex-end">

      <button class="btn sm" data-search-page="${cur - 1}" ${cur <= 1 ? 'disabled' : ''}>上一页</button>
      <button class="btn sm" data-search-page="${cur + 1}" ${cur >= pages ? 'disabled' : ''}>下一页</button>
    </div>` : ''}
  </div>`;
}
function highlightText(text, q) {
  if (!q) return esc(text);
  const needle = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return esc(text).replace(new RegExp(needle, 'g'), (m) => `<em>${m}</em>`);
}

        <li>运维：<code>看看运行状态</code>、<code>帮我巡检一下</code>、<code>重启停滞任务</code>、<code>重置熔断器</code></li>
        <li>配置：<code>测试向量服务连通</code>、<code>启动本地模型</code>、<code>把向量模式切换成本地推理</code>（会先出确认卡）</li>

      <h3>安全边界</h3>
      <ul>
        <li>删除、切换模型这类不可撤销动作<b>先出确认卡</b>，点了「确认执行」才会动；点「放弃」没有任何改动。</li>

        <li>所有「服务连通」「重启服务」「熔断」都是内存里的状态切换，不会真的发起对外请求。</li>
        <li>AI 会话侧只说日常话；文件管理与系统配置这类管理页保留专业监控用词（看门狗、熔断器、向量维度）。</li>

      <h3>刷新与重置</h3>
      <p>数据存在浏览器 localStorage（<code>file://</code> 下若被限制则退化为内存态，刷新即复位）。右上角「重置演示数据」恢复初始 24 份资料与空白会话。</p>

        <li>检索是关键词 + 规则打分，没有真实向量；嵌入维度只作为配置项展示。</li>

function scrollChatToEnd() {
  const el = $('#chat-scroll');

}

function modal(html, width) {
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = `<div class="modal"${width ? ` style="width:${width}"` : ''}>${html}</div>`;
  mask.addEventListener('click', (e) => {
    if (e.target === mask || e.target.closest('[data-close]')) mask.remove();
  });
  document.body.appendChild(mask);
  return mask;
}

      <table class="paper" style="width:100%;border-collapse:collapse">${[
        kv('文件名', f.original_name), kv('目录', f.directory_path), kv('来源', f.source === 'session' ? 'AI 会话' : f.source === 'upload' ? '页面内上传' : '目录索引'),
        kv('归属客户', f.customer || '集团内部'), kv('所属部门', f.department || '—'), kv('资料性质', f.nature || '—'),
        kv('合同金额', f.amount_wan ? `${f.amount_wan} 万元` : '—'), kv('文件大小', fmtSize(f.file_size)),
        kv('段落数', f.chunk_count || 0), kv('字符数', MONO(f.character_count || 0)), kv('处理耗时', (f.processing_time_ms || 0) + ' ms'),
        kv('创建时间', fmtTime(f.created_at)), kv('更新时间', fmtTime(f.updated_at)),
        kv('摘要', f.summary || '—'), kv('错误信息', f.error_message || '—'),
      ].join('')}</table>
    </div>
    <div class="modal-foot"><button class="btn sm" data-preview="${f.id}" data-preview-name="${esc(f.original_name)}">预览</button>
      <button class="btn sm" data-close>关闭</button></div>`);
}

function openReset() {
  modal(`<div class="modal-head"><b>重置演示数据</b></div>
    <div class="modal-body">
      <p class="notice-bar">会把资料库恢复到初始 24 份演示资料，并清空会话、批注与配置改动。这个动作不可撤销。</p>
      <p class="tiny muted">输入 <b>CONFIRM</b> 后「确认重置」才可用。</p>
      <input id="reset-input" placeholder="输入 CONFIRM" style="border:1px solid var(--color-border);padding:6px 8px;font-size:13px;width:220px">
    </div>
    <div class="modal-foot"><button class="btn sm" data-close>取消</button>
      <button class="btn primary sm" id="reset-ok" disabled>确认重置</button></div>`);
  const input = $('#reset-input'), ok = $('#reset-ok');
  input.addEventListener('input', () => { ok.disabled = input.value.trim() !== 'CONFIRM'; });
  ok.addEventListener('click', async () => {
    await api.resetMockDb();
    const m = document.querySelector('.mask');
    if (m) m.remove();
    persist(); go('#/'); render(); toast('已恢复初始演示数据');
  });
}

function openBrowse() {
  const dirs = [...new Set(FILES.map((f) => f.directory_path))].slice(0, 12);
  modal(`<div class="modal-head"><b>扫描目录</b><span class="grow"></span><span class="tag">虚拟目录树 · 本地模拟</span></div>
    <div class="modal-body">
      <p class="tiny muted">这里列出的是内存资料所在目录。真实系统会把目录里的文件逐份解析后写入索引；原型不读磁盘。</p>
      <ul class="op-output">${dirs.map((d) => `<li class="mono tiny">${esc(d)}</li>`).join('')}</ul>
    </div>
    <div class="modal-foot"><button class="btn primary sm" id="browse-run">开始收录</button><button class="btn sm" data-close>关闭</button></div>`);
  $('#browse-run').onclick = async () => {
    const res = await api.indexFolder(dirs[0], true);
    $('.mask') && $('.mask').remove();
    toast(`已收录 ${(res && res.count) || 0} 份资料`);
    persist(); render();
  };
}

function dropEmptySessions(exceptId) {
  SESSIONS = SESSIONS.filter((s) => s.id === exceptId || messagesOf(s.id).length > 0);
}

function bindView() {
  $$('[data-nav]').forEach((el) => { el.onclick = () => go(el.getAttribute('data-nav')); });
  $$('[data-session]').forEach((el) => {
    el.onclick = () => {
      // 点当前会话标题（在首页时）不重复进入
      activeSession = el.getAttribute('data-session');
      persist(); render();
      setTimeout(scrollChatToEnd, 30);
    };
  });
  $$('[data-new-session]').forEach((el) => { el.onclick = () => newSession(); });
  $$('[data-say]').forEach((el) => {
    el.onclick = () => {
      let target = activeSession;
      if (!SESSIONS.some((s) => s.id === activeSession)) target = newSession(true);
      sendUserMessage(target, el.getAttribute('data-say'));
      setTimeout(scrollChatToEnd, 30);
    };
  });
  $$('[data-upload]').forEach((el) => { el.onclick = () => { const i = $('#file-input'); if (i) i.click(); else toast('请到文件管理页上传资料'); }; });

  // 首页「尝试这样说」→ 点一下就直接发送（先确保有会话）
  const ensureSession = () => (SESSIONS.some((s) => s.id === activeSession) ? activeSession : newSession(true));

  // 搜索页
  $$('[data-search-apply]').forEach((el) => { el.onclick = applySearch; });
  $$('[data-search]').forEach((el) => { el.onclick = applySearch; });
  const qInput = $('#q');
  if (qInput) qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') applySearch(); });
  $$('[data-search-reset]').forEach((el) => { el.onclick = () => go('#/search'); });
  $$('[data-say-search]').forEach((el) => {
    el.onclick = () => go('#/search?q=' + encodeURIComponent(el.getAttribute('data-say-search')));
  });
  $$('[data-search-page]').forEach((el) => {
    el.onclick = () => {
      const qs2 = new URLSearchParams(currentRoute.query);
      qs2.set('page', el.getAttribute('data-search-page'));
      go('#/search?' + qs2.toString());
    };
  });
  $$('[data-goto-search]').forEach((el) => {
    el.onclick = () => {
      const [k, v] = el.getAttribute('data-goto-search').split('=');
      go(`#/search?${k}=${v}&mode=hybrid`);
    };
  });
  // 文件管理
  $$('[data-files-status]').forEach((el) => { el.onclick = () => go('#/files?status=' + el.getAttribute('data-files-status')); });
  $$('[data-lib-link]').forEach((el) => { el.onclick = () => go('#/files?lib=' + encodeURIComponent(el.getAttribute('data-lib-link'))); });
  const libSel = $('#files-lib');
  if (libSel) libSel.onchange = () => {
    const qs = new URLSearchParams(location.hash.split('?')[1] || '');
    if (libSel.value === 'all') qs.delete('lib'); else qs.set('lib', libSel.value);
    qs.delete('page');
    const tail = qs.toString();
    go('#/files' + (tail ? '?' + tail : ''));
  };
  $$('[data-files-session]').forEach((el) => { el.onclick = () => go('#/files?session=1'); });
  $$('[data-files-page]').forEach((el) => {
    if (el.hasAttribute('disabled')) return;
    el.onclick = () => {
      const qs2 = new URLSearchParams(currentRoute.query);
      qs2.set('page', el.getAttribute('data-files-page'));
      go('#/files?' + qs2.toString());
    };
  });
  $$('[data-preview]').forEach((el) => {
    el.onclick = () => openPreview(el.getAttribute('data-preview'), el.getAttribute('data-preview-name'));
  });
  $$('[data-detail]').forEach((el) => { el.onclick = () => openDetail(el.getAttribute('data-detail')); });
  $$('[data-retry]').forEach((el) => {
    el.onclick = async () => {
      await api.fileAction(el.getAttribute('data-retry'), 'retry');
      toast('已重新处理'); persist(); render();
    };
  });
  $$('[data-del]').forEach((el) => {
    el.onclick = async () => {
      const id = el.getAttribute('data-del');
      const f = fileById(id);
      if (!confirm(`删除「${f ? f.original_name : id}」？会同时从检索范围里移除。`)) return;
      const res = await api.batchDeleteFiles([id]);
      toast(`已删除 ${(res && res.deleted) || 1} 份资料`);
      persist(); render();
    };
  });
  // 文件管理：搜索 / 全选 / 批量动作
  const fkw = $('#files-kw');
  if (fkw) {
    fkw.addEventListener('input', () => {
      const qs3 = new URLSearchParams();
      if (fkw.value.trim()) qs3.set('q', fkw.value.trim());
      if (currentRoute.query.get('status')) qs3.set('status', currentRoute.query.get('status'));
      if (currentRoute.query.get('session')) qs3.set('session', '1');
      go('#/files' + (qs3.toString() ? '?' + qs3.toString() : ''));
    });
  }
  const fst = $('#files-status');
  if (fst) {
    fst.onchange = () => {
      const qs3 = new URLSearchParams(currentRoute.query);
      qs3.delete('page');
      if (fst.value === 'all') qs3.delete('status'); else qs3.set('status', fst.value);
      go('#/files' + (qs3.toString() ? '?' + qs3.toString() : ''));
    };
  }
  const call = $('#check-all');
  if (call) {
    call.onchange = () => { $$('.file-check').forEach((c) => { c.checked = call.checked; }); };
  }
  $$('[data-parse-all]').forEach((el) => {
    el.onclick = async () => {
      const ids = $$('.file-check').filter((c) => c.checked).map((c) => c.value);
      const targets = ids.length ? FILES.filter((f) => ids.includes(f.id)) : FILES.filter((f) => f.status === 'pending' || f.status === 'failed');
      for (const f of targets) await api.fileAction(f.id, 'parse');
      toast(`已处理 ${targets.length} 份资料`); persist(); render();
    };
  });
  $$('[data-reset-db]').forEach((el) => { el.onclick = () => openReset(); });
  $$('[data-parse]').forEach((el) => {
    el.onclick = async () => {
      await api.fileAction(el.getAttribute('data-parse'), 'parse');
      toast('处理完成'); persist(); render();
    };
  });
  $$('[data-anno]').forEach((el) => {
    el.onclick = async () => {
      const rating = el.getAttribute('data-anno-rating') || 'accurate';
      await api.submitAnnotation({
        query: el.getAttribute('data-anno-query'),
        file_id: el.getAttribute('data-anno'),
        rating,
        issues: rating === 'inaccurate' ? '检索结果与问题不匹配' : '结果符合预期',
      });
      toast(rating === 'accurate' ? '已标记为准确' : '已标记为不准确，可在 Agent 控制台看到');
      persist();
    };
  });
  $$('[data-anno-done]').forEach((el) => {
    el.onclick = async () => {
      await api.processAnnotation(el.getAttribute('data-anno-done'));
      toast('已标记为处理完成'); persist(); render();
    };
  });
  // Agent 控制台
  $$('[data-agent-action]').forEach((el) => {
    el.onclick = async () => {
      const action = el.getAttribute('data-agent-action');
      const res = await api.runAgentAction(action);
      toast((res && res.message) || '已执行');
      persist(); render();
    };
  });
  // 系统配置
  $$('[data-test-model]').forEach((el) => {
    el.onclick = async () => {
      const r = await api.testRemoteModel(el.getAttribute('data-test-model'));
      toast(r && r.ok ? `连通正常，延迟约 ${r.latency_ms} ms` : '服务不可用');
      persist(); render();
    };
  });
  $$('[data-toggle-model]').forEach((el) => {
    el.onclick = async () => {
      const type = el.getAttribute('data-toggle-model');
      const mode = el.getAttribute('data-mode');
      await api.toggleModel(type, mode);
      toast('已切换'); persist(); render();
    };
  });
  $$('[data-to-local]').forEach((el) => {
    el.onclick = async () => {
      await api.toggleModel('embedding', 'local');
      toast('已切换为本地推理'); persist(); render();
    };
  });
  $$('[data-to-remote]').forEach((el) => {
    el.onclick = async () => {
      await api.toggleModel('embedding', 'remote');
      toast('已切换为远程接口'); persist(); render();
    };
  });
  $$('[data-start-local]').forEach((el) => {
    el.onclick = async () => {
      await api.startLocalModel();
      toast('本地模型已启动'); persist(); render();
    };
  });
  // 操作卡
  $$('[data-confirm]').forEach((el) => { el.onclick = () => confirmOperation(el.getAttribute('data-confirm')); });
  $$('[data-cancel]').forEach((el) => {
    el.onclick = () => { cancelOperation(el.getAttribute('data-cancel')); };
  });
}

/* 发送框回车发送 */
document.addEventListener('keydown', (e) => {
  if (e.target && e.target.id === 'composer' && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const ta = e.target;
    const text = ta.value;
    if (!text.trim()) return;
    const target = SESSIONS.some((s) => s.id === activeSession) ? activeSession : newSession(true);
    ta.value = '';
    sendUserMessage(target, text.trim());
    setTimeout(scrollChatToEnd, 30);
  }
});

/* 文件选择上传（真实读取用户选中的文件名，内容不入库） */
document.addEventListener('change', async (e) => {
  if (!e.target || e.target.id !== 'file-input') return;
  const list = [...(e.target.files || [])];
  if (!list.length) return;
  for (const file of list) {
    await api.uploadFile(file.name, file.size);
  }
  if (!SESSIONS.some((s) => s.id === activeSession)) newSession(true);
  toast(`已加入 ${list.length} 份资料`);
  persist(); render();
});

/* 发送按钮 */
function bindComposer() {
  $$('[data-send]').forEach((el) => {
    el.onclick = () => {
      const ta = $('#composer');
      if (!ta) return;
      const text = ta.value.trim();
      if (!text) return;
      const target = SESSIONS.some((s) => s.id === activeSession) ? activeSession : newSession(true);
      ta.value = '';
      sendUserMessage(target, text);
      setTimeout(scrollChatToEnd, 30);
    };
  });
}

function applySearch() {
  const qs = new URLSearchParams();
  const get = (id) => ($(id) ? $(id).value : '');
  const q = get('#q').trim();
  const mode = get('#mode') || 'hybrid';
  const department = get('#department');
  const nature = get('#nature');
  const amount_min = get('#amount_min');
  if (q) qs.set('q', q);
  if (mode !== 'hybrid') qs.set('mode', mode);
  if (department) qs.set('department', department);
  if (nature) qs.set('nature', nature);
  if (amount_min) qs.set('amount_min', amount_min);
  go('#/search' + (qs.toString() ? '?' + qs.toString() : ''));
  if (q) {
    const hist = (safeStore.get('kb-history') || '').split('|').filter(Boolean).filter((x) => x !== q);
    safeStore.set('kb-history', [q, ...hist].slice(0, 8).join('|'));
  }
}

/* ---------------- 13. 启动 ---------------- */
function newSession() {
  const id = uid('sess');
  SESSIONS.push({ id, title: '新会话', createdAt: Date.now(), updatedAt: Date.now(), titled: false });
  dropEmptySessions(id);
  activeSession = id;
  persist();
  return id;
}

restore();
if (!location.hash) location.hash = '#/';
currentRoute = parseHash();
render();
$('#btn-reset').onclick = () => openReset();

</script>
</body>
</html>
