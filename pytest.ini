[pytest]
# 默认用测试专用配置：它会在"Postgres 连不上"时自动退回 SQLite，
# 让单测完全离线可跑；想强制验证真实 PostgreSQL 就用 --kb-db=postgres。
DJANGO_SETTINGS_MODULE = knowledgebase.test_settings
python_files = test_*.py
testpaths = tests
addopts = -q --strict-markers
markers =
    real_qdrant: 需要本机真实 Qdrant（docker compose 起的 knowledgebase-qdrant）
    real_as711: 需要 AS711 模型服务（当前断开，默认跳过）
    real_broker: 需要本机真实 Redis broker（--kb-broker 启用）
filterwarnings =
    error::DeprecationWarning:apps.*
    error::DeprecationWarning:knowledgebase.*
